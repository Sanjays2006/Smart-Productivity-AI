<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FocusAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      background: #020617;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(10, 11, 20, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 
                  0 0 30px rgba(138, 43, 226, 0.05);
      z-index: 10;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    
    .auth-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 24px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .auth-logo i { color: var(--secondary); text-shadow: 0 0 15px var(--secondary); }
    
    .form-label { color: #94a3b8; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      transition: all 0.3s;
      font-size: 0.9rem;
    }
    .form-control:focus {
      background: rgba(0, 0, 0, 0.5);
      border-color: var(--secondary);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.15);
    }
    .form-control::placeholder {
      color: #475569;
    }
    
    .btn-auth {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      color: white;
      width: 100%;
      margin-top: 10px;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85rem;
    }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0, 255, 255, 0.4); }
    .btn-auth:active { transform: translateY(0); }
    
    .btn-auth-google {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      color: white;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-auth-google:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }
    .btn-auth-google i { font-size: 1.1rem; }
    
    .auth-footer { text-align: center; margin-top: 24px; color: #94a3b8; font-size: 0.85rem; }
    .auth-footer a { color: var(--secondary); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-shadow: 0 0 10px var(--secondary); }
    
    .ambient-orb {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
      filter: blur(60px);
      z-index: 1;
      opacity: 0.4;
    }
    .orb-1 { top: -100px; right: -100px; background: radial-gradient(circle, rgba(138, 43, 226, 0.25) 0%, transparent 70%); }
    .orb-2 { bottom: -100px; left: -100px; background: radial-gradient(circle, rgba(0, 255, 255, 0.15) 0%, transparent 70%); }
  </style>
</head>
<body>

  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <div class="auth-card">
    <div class="auth-logo"><i class="fa-solid fa-bolt-lightning"></i>Focus<em>AI</em></div>
    
    <!-- SIGN IN FORM -->
    <div id="loginForm">
      <h5 class="text-white mb-4" style="font-weight: 700; letter-spacing: 0.5px;">COGNITIVE SIGN IN</h5>
      
      <div class="mb-3">
        <label class="form-label">Username or Email</label>
        <input type="text" id="loginEmail" class="form-control" placeholder="Username or name@example.com" required autocomplete="username">
      </div>
      
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="loginPassword" class="form-control mt-1" placeholder="••••••••" required autocomplete="current-password">
      </div>
      
      <button class="btn-auth btn-glow" id="btnLogin" onclick="handleLogin()">Sign In</button>
      
      <div class="auth-footer">
        New explorer? <a href="#" onclick="toggleAuth(event)">Create account</a>
      </div>
    </div>

    <!-- SIGN UP FORM -->
    <div id="registerForm" style="display: none;">
      <h5 class="text-white mb-4" style="font-weight: 700; letter-spacing: 0.5px;">ESTABLISH CORE PROFILE</h5>
      
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="regUsername" class="form-control" placeholder="Choose username" required autocomplete="username">
      </div>
      
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
      </div>
      
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password">
      </div>
      
      <button class="btn-auth btn-glow" id="btnRegister" onclick="handleRegister()">Sign Up</button>
      
      <div class="auth-footer">
        Have active credentials? <a href="#" onclick="toggleAuth(event)">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    function toggleAuth(e) {
      e.preventDefault();
      const login = document.getElementById('loginForm');
      const register = document.getElementById('registerForm');
      if (login.style.display === 'none') {
        gsap.to(register, { opacity: 0, y: 10, duration: 0.3, onComplete: () => {
          register.style.display = 'none';
          login.style.display = 'block';
          gsap.fromTo(login, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3 });
        }});
      } else {
        gsap.to(login, { opacity: 0, y: 10, duration: 0.3, onComplete: () => {
          login.style.display = 'none';
          register.style.display = 'block';
          gsap.fromTo(register, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3 });
        }});
      }
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const p = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLogin');
      
      if (!email || !p) return alert('Please fill all fields');
      
      btn.disabled = true;
      btn.innerText = 'Authenticating...';
      
      try {
        await Api.login(email, p);
        window.location.href = '/index.html';
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.innerText = 'Sign In';
      }
    }

    async function handleRegister() {
      const u = document.getElementById('regUsername').value.trim();
      const e = document.getElementById('regEmail').value.trim();
      const p = document.getElementById('regPassword').value;
      const btn = document.getElementById('btnRegister');
      
      if (!u || !e || !p) return alert('Please fill all fields');
      
      btn.disabled = true;
      btn.innerText = 'Establishing profile...';
      
      try {
        await Api.register(u, e, p);
        window.location.href = '/index.html';
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.innerText = 'Sign Up';
      }
    }


  </script>
</body>
</html>
