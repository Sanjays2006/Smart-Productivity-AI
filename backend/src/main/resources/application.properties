spring.application.name=focus-tracker

# ─── Database Console & Schema Auto-provisioning ──────────────────────────────
# NOTE: disable the H2 console in production (set H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.jpa.hibernate.ddl-auto=update

# ─── JWT Config ────────────────────────────────────────────────────────────
# SECRET must be supplied via env var. The dev fallback is intentionally invalid
# so a missing secret fails fast in prod rather than shipping a known key.
jwt.secret=${JWT_SECRET:CHANGE_ME_DEV_ONLY_generate_a_long_random_base64_secret}
jwt.expiration=${JWT_EXPIRATION:604800000}

# ─── Server ────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=7d

# ─── Ollama AI ─────────────────────────────────────────────────────────────
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:phi3}
ollama.embed-model=${OLLAMA_EMBED_MODEL:nomic-embed-text}

# ─── Spring Security (fallback admin user) ─────────────────────────────────
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:}

# ─── Logging ───────────────────────────────────────────────────────────────
logging.level.com.tracker=INFO
logging.level.org.springframework.security=WARN

# ─── Session ───────────────────────────────────────────────────────────────
server.servlet.session.cookie.same-site=lax

# ─── Async / Thread Pool (low-RAM optimization) ────────────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50

# ─── Ollama timeout (give model time to load on first run) ─────────────────
ollama.connect-timeout=15000
ollama.read-timeout=180000
